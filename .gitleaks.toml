# Gitleaks configuration for First AI Movers article archive.
# This repo is public and intentionally contains:
#   - Public IndexNow verification keys (not secrets)
#   - Article text with external canonical URLs
#   - Historical presigned URLs in article content
#
# Allowlist entries are narrow and documented. Do not broaden them without
# recording the justification.

title = "FAM Article Archive Gitleaks Config"

# Extend the gitleaks DEFAULT ruleset — every built-in secret rule stays active.
# REQUIRED: without this, `gitleaks detect --config .gitleaks.toml` loads ONLY the rules defined
# in this file (zero), so it detects NOTHING and the allowlist below has no ruleset to act on
# (the gate is a silent no-op that always passes). Verified with the pinned gitleaks 8.18.2:
# WITHOUT useDefault a planted `ghp_…`/Slack token is NOT flagged (0 rules); WITH useDefault the
# default rules fire and a full-history scan of this repo is clean (0 findings — the allowlist
# below covers the only two known public/third-party values). Matches agent-toolkit + radar.
# (GITLEAKS-ALLOWLIST-CONSISTENCY-AUDIT-A, 2026-06-22.)
[extend]
useDefault = true

[allowlist]
description = "Known public tokens and documented placeholders"

# 1. IndexNow keys are public proof-of-host ownership, not secrets.
#    They may appear in docs, generated site, and test fixtures.
# 2. AWS credential embedded in a Beehiiv presigned audio URL inside
#    article content. This is a third-party URL that was published
#    by the canonical publisher; the credential is not ours and the
#    URL is already public. The scrubber (tools/scrub_presigned_urls.py)
#    is the long-term fix; this allowlist prevents CI noise until scrubbed.
regexes = [
    # Exact known public IndexNow keys (documented in env vars)
    '''ee4c7a6ad2464b84a2320e9edf0fe996''',
    # AWS credential in Beehiiv presigned URL (third-party, already public)
    '''AKIAQCMHTQSE2JGAGXHJ''',
]

# Path allowlist — NARROWED 2026-06-23 (ARTICLES-GITLEAKS-ALLOWLIST-PATH-TIGHTEN-A). Now that the
# default ruleset actually runs (the [extend] above, #293), a full-history scan with default rules
# but NO path allowlist surfaces `generic-api-key` findings in EXACTLY three files — all
# IndexNow-key-shaped test fixtures / the monitoring doc, verified non-secret. The prior blanket
# entries (site/.*, docs/.*, .github/workflows/.*, tools/tests/.*, CONTRIBUTING/SECURITY/ROADMAP/
# README.md, .gitleaks.toml, the Beehiiv article) were dropped: the scan proves they suppress
# NOTHING — the two known third-party/public values are covered by the exact `regexes` above, which
# apply everywhere and so need no path exemption. These are exact FILE paths, not directories, so
# every OTHER file under docs/, tools/tests/, .github/workflows/, site/, etc. is now fully scanned.
paths = [
    '''tools/tests/test_submit_indexnow\.py$''',  # writes a synthetic .indexnow-key fixture
    '''tools/tests/test_tools\.py$''',            # historical IndexNow test fixture (git history; CI scans history)
    '''docs/search-visibility-monitoring\.md$''', # documents the public IndexNow key
]
