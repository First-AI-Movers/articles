version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      # Delay updates after a release so a malicious/broken version has time to
      # be flagged before Dependabot opens a PR (zizmor dependabot-cooldown).
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # npm — root + og-worker. (og-worker tolerates vitest v4 — no vitest ignore here.)
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/og-worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"

  # npm — mcp-server (split out to scope a vitest major-version ignore to THIS directory only).
  # vitest is pinned to v3 here because `@cloudflare/vitest-pool-workers@^0.8` peers to vitest 3.x;
  # a vitest v4 major bump breaks the workers test pool (verified: PR #274 `test` FAILURE). Security
  # patches WITHIN v3 still flow (only semver-major is ignored). LIFT CONDITION: remove this ignore
  # once @cloudflare/vitest-pool-workers supports vitest 4.x, then let Dependabot bump vitest major.
  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
