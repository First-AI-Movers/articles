version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      # Delay updates after a release so a malicious/broken version has time to
      # be flagged before Dependabot opens a PR (zizmor dependabot-cooldown).
      default-days: 7
      semver-major-days: 14
    # Group minor+patch into one PR to cut noise; majors stay individual PRs so a
    # breaking bump (e.g. numpy 2.x) is reviewed on its own and never silently batched.
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      default-days: 7
    # Minor+patch grouped; major @vN tag bumps (e.g. actions/checkout 6→7) stay individual,
    # preserving the governed @vN + Dependabot pin policy and per-bump review.
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    # The cookiecutter template's workflows are NOT watched by Dependabot (#362). A second
    # entry with `directory: "/cookiecutter-archive-template/{{cookiecutter.repo_slug}}"`
    # existed from 2026-09-20 to 2026-11-09 and never ran: in eight Monday schedules every
    # github-actions job was the root one ("github_actions in /."), none named the template
    # directory, and no template PR ever opened. An entry that parses but schedules nothing
    # only looks like coverage, so it was removed. The template's pins are held to the root
    # convention by tools/tests/test_template_action_pins.py instead.

  # npm — root + mcp-server + og-worker. (An earlier /mcp-server-scoped vitest semver-major ignore was
  # LIFTED 2026-06-22: its documented lift condition is met — mcp-server migrated to
  # @cloudflare/vitest-pool-workers 0.16 + vitest 4 in #289 (pool-workers now peers vitest ^4), so
  # vitest-major updates flow normally again and the separate /mcp-server entry is no longer needed.)
  - package-ecosystem: "npm"
    # npm -- three single-`directory:` entries, NOT one `directories:` list (#488).
    #
    # The vitest hold. vitest 5 CANNOT INSTALL in either worker tree, so a carrier for it
    # is a PR that can never go green (#432):
    #
    #   npm error While resolving: @cloudflare/vitest-pool-workers@0.22.0
    #   npm error Found: vitest@5.0.0
    #   npm error peer vitest@"^4.1.0" from @cloudflare/vitest-pool-workers@0.22.0
    #
    # LIFT CONDITION (executable, not a promise): when a pool-workers release peers
    # vitest ^5 and the lockfiles carry it, `tools/tests/test_dependabot_ignore_lift_conditions.py`
    # FAILS and names this hold. Delete the vitest `ignore` rules below then; do not renew
    # them by hand. The root package.json has no vitest, so its entry carries no hold.
    #
    # WHY THE SPLIT (#488). Until 2026-11-09 these three directories were one entry with
    # `directories:`, and the hold failed five times (#451/#452, #485/#486, #498/#499,
    # #522/#523, #538/#539, and again #554/#555). Dependabot's own job log shows why: the
    # job definition GitHub sent the updater carried `"ignore-conditions":[]` in every
    # scheduled job from 2026-10-05 to 2026-11-09, while the SAME entry's `cooldown` arrived
    # intact. The ignore was never delivered; its shape was never the problem.
    #
    # The split tests the one structural difference: this was the only multi-directory
    # entry. HOW TO READ THE RESULT -- in the next npm job log for /mcp-server or /og-worker
    # (`gh run view <id> --log`, runs with event `dynamic`), read `"ignore-conditions"`:
    #   * it lists vitest -> `directories:` was dropping the ignore; keep the split.
    #   * still `[]`      -> the cause is elsewhere on GitHub's side. Report it upstream.
    # Either way, a red Dependabot head is refused by the arming step (#489, closed), so
    # this hold is no longer what keeps a vitest-5 carrier off `main`.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Minor+patch grouped; a major like zod 3->4 stays its own PR for review.
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "vitest"
        versions:
          - ">=5.0.0"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "npm"
    directory: "/og-worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "vitest"
        versions:
          - ">=5.0.0"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
