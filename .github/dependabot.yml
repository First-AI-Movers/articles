version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      # Delay updates after a release so a malicious/broken version has time to
      # be flagged before Dependabot opens a PR (zizmor dependabot-cooldown).
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # npm — root + mcp-server + og-worker. (The /mcp-server-scoped vitest semver-major ignore was
  # LIFTED 2026-06-22: its documented lift condition is met — mcp-server migrated to
  # @cloudflare/vitest-pool-workers 0.16 + vitest 4 in #289 (pool-workers now peers vitest ^4), so
  # vitest-major updates flow normally again and the separate /mcp-server entry is no longer needed.)
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/mcp-server"
      - "/og-worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
