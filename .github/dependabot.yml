version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      # Delay updates after a release so a malicious/broken version has time to
      # be flagged before Dependabot opens a PR (zizmor dependabot-cooldown).
      default-days: 7
      semver-major-days: 14
    # Group minor+patch into one PR to cut noise; majors stay individual PRs so a
    # breaking bump (e.g. numpy 2.x) is reviewed on its own and never silently batched.
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      default-days: 7
    # Minor+patch grouped; major @vN tag bumps (e.g. actions/checkout 6→7) stay individual,
    # preserving the governed @vN + Dependabot pin policy and per-bump review.
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    # The cookiecutter template's workflows are NOT watched by Dependabot (#362). A second
    # entry with `directory: "/cookiecutter-archive-template/{{cookiecutter.repo_slug}}"`
    # existed from 2026-09-20 to 2026-11-09 and never ran: in eight Monday schedules every
    # github-actions job was the root one ("github_actions in /."), none named the template
    # directory, and no template PR ever opened. An entry that parses but schedules nothing
    # only looks like coverage, so it was removed. The template's pins are held to the root
    # convention by tools/tests/test_template_action_pins.py instead.

  - package-ecosystem: "npm"
    # npm -- three single-`directory:` entries, NOT one `directories:` list (#488).
    #
    # The vitest semver-major hold was lifted (#580): both workers moved from the deprecated
    # @cloudflare/vitest-pool-workers to @cloudflare/vitest-plugin, which peers
    # vitest ^4.1.0 || ^5.0.0, so a vitest 5 carrier can install in either tree.
    # An uninstallable vitest carrier now surfaces as that worker's own `npm ci` failure.
    #
    # WHY THE SPLIT (#488). Until 2026-11-09 these three directories were one entry with
    # `directories:`, and the (then) vitest hold failed five times (#451/#452, #485/#486, #498/#499,
    # #522/#523, #538/#539, and again #554/#555). Dependabot's own job log shows why: the
    # job definition GitHub sent the updater carried `"ignore-conditions":[]` in every
    # scheduled job from 2026-10-05 to 2026-11-09, while the SAME entry's `cooldown` arrived
    # intact. The ignore was never delivered; its shape was never the problem.
    #
    # The split was the fix. The first jobs after it (2026-11-09, runs 42657264836 and
    # 42657264485) carried both vitest rules in `"ignore-conditions"` and logged "All updates
    # for vitest were ignored". So DO NOT fold these entries back into `directories:` while
    # any of them carries an `ignore`: the multi-directory form silently drops it. To check
    # a hold, read `"ignore-conditions"` in the job log (`gh run view <id> --log`, runs with
    # event `dynamic`). A red Dependabot head is also refused by the arming step (#489).
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Minor+patch grouped; a major like zod 3->4 stays its own PR for review.
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "npm"
    directory: "/og-worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
