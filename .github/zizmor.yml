# zizmor configuration — Articles (ARTICLES-ZIZMOR-SCOPED-ADVISORY-A)
#
# Articles GOVERNS GitHub Actions pinning by major-version tag (@v4/@v5/@v6…) managed by
# Dependabot, per SECURITY.md §"Dependencies" ("GitHub Actions use pinned major versions
# (@v4, @v5)") and the workflow-pin tests in tools/tests/. That is a deliberate, documented
# policy — not a gap. zizmor's `unpinned-uses` audit otherwise flags every @vN tag as
# unpinned (it defaults to requiring hash-pins), which would bury the advisory signal.
#
# So we set the `unpinned-uses` policy to `ref-pin` (tag/ref pins are acceptable) for all
# actions, aligning zizmor with Articles' governed policy. This does NOT disable zizmor —
# every other audit (template-injection, excessive-permissions, artipacked, dangerous-
# triggers, dependabot-cooldown, …) stays fully active. If Articles ever moves to SHA pins,
# tighten the relevant pattern to `hash-pin`.
rules:
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
