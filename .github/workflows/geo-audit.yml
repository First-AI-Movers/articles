name: GEO audit

on:
  pull_request:
    # GEO audit scores every article in articles/. Pure-docs / ROADMAP
    # edits cannot change those scores. Article markdown IS content and
    # DOES trigger this audit (N6, 2026-05-15).
    paths-ignore:
      - 'ROADMAP.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - 'ROADMAP.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt

      - name: Run GEO audit
        run: python3 tools/geo_audit.py

      - name: Upload GEO audit reports
        uses: actions/upload-artifact@v7
        with:
          name: geo-audit-reports
          path: |
            geo_audit_report.json
            geo_audit_report.md
