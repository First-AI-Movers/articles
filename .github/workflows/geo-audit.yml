name: GEO audit

on:
  pull_request:
    # GEO audit scores every article in articles/. Pure-docs / ROADMAP
    # edits cannot change those scores. Article markdown IS content and
    # DOES trigger this audit (N6, 2026-05-15).
    paths-ignore:
      - 'ROADMAP.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - 'ROADMAP.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt

      - name: Run GEO audit
        run: python3 tools/geo_audit.py

      - name: Upload GEO audit reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geo-audit-reports
          path: |
            geo_audit_report.json
            geo_audit_report.md
