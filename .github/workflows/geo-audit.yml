name: GEO audit

on:
  pull_request:
    # GEO audit scores every article in articles/. A docs-only PR cannot
    # change those scores. Skipping saves ~30s install + full-corpus scan.
    paths-ignore:
      - 'ROADMAP.md'
      - 'docs/**'
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - 'ROADMAP.md'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt

      - name: Run GEO audit
        run: python3 tools/geo_audit.py

      - name: Upload GEO audit reports
        uses: actions/upload-artifact@v4
        with:
          name: geo-audit-reports
          path: |
            geo_audit_report.json
            geo_audit_report.md
