name: Ingest Airtable dispatch (E20b)

on:
  repository_dispatch:
    types: [airtable-record-updated]
  workflow_dispatch:
    inputs:
      record_id:
        description: "Airtable record ID to ingest"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

# Share the `ingest-airtable` concurrency group with the cron workflow.
# Push-driven dispatches (E20b) and the daily cron (E20a) must not run
# in parallel — they touch the same rebuild artifacts and the same
# create-pull-request branch pattern.
concurrency:
  group: ingest-airtable
  cancel-in-progress: false

env:
  INGEST_DRY_RUN: ${{ vars.INGEST_DRY_RUN || '1' }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert the App credentials are visible
        # FAIL FAST, AND FAIL WHERE THE CAUSE IS NAMED (#388).
        #
        # The root cause was not simply an expired credential. It was that
        # `${{ secrets.PAT || secrets.GITHUB_TOKEN }}` falls back on EMPTY and never on
        # INVALID: an expired PAT stays truthy, so the fallback never fired and the job died
        # much later inside a third-party action with `fatal: could not read Username`.
        #
        # UNCONDITIONAL ON PURPOSE. Checking only on the branch that publishes would repeat the
        # exact way this hid: `ingest-airtable` reported green for three weeks after the
        # credential died, because on days with no new records it never reached the step that
        # needed it. A publication workflow that cannot publish should say so on the first run,
        # not on the first run that had something to say.
        env:
          APP_ID_PRESENT: ${{ vars.AEOS_REVERT_APP_ID != '' }}
          APP_KEY_PRESENT: ${{ secrets.AEOS_REVERT_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$APP_ID_PRESENT" != "true" ] || [ "$APP_KEY_PRESENT" != "true" ]; then
            echo "::error::AEOS_REVERT_APP_ID (org variable) or AEOS_REVERT_APP_PRIVATE_KEY (org secret) is not visible to this repository, so no PR can be published. The secret's visibility is 'selected repositories'; First-AI-Movers/articles must be added to it."
            exit 1
          fi
          echo "App id and private key are both visible to this repository."

      - name: Mint a short-lived App token for branch and PR publication
        # SHORT-LIVED, REPOSITORY-SCOPED, NOT A PAT (#388). This installation token expires in
        # about an hour and is scoped to this repository by default -- `owner` and
        # `repositories` are deliberately omitted. It replaces ARTICLE_INGESTION_PR_TOKEN, a
        # personal access token stored 2026-05-03 that went invalid around 2026-08-02 and broke
        # every publishing workflow in this repository without raising an alert.
        #
        # AN APP TOKEN RATHER THAN GITHUB_TOKEN, for a mechanical reason: GitHub suppresses
        # workflow runs on a PR created with the default GITHUB_TOKEN, to prevent recursion. A
        # PR opened that way would never run `aeos-merge-ready` -- the organization's only
        # required check -- and so could never merge. Working around that is exactly why a PAT
        # was here; an App token has the same property with none of the lifetime.
        #
        # Same App, action and pin the organization already trusts for the post-main automatic
        # revert rail (First-AI-Movers/.github `aeos-main-smoke.yml`).
        id: app_token
        # PINNED BY MAJOR-VERSION TAG, matching this repository's governed convention
        # (SECURITY.md "Dependencies", .github/zizmor.yml `unpinned-uses: ref-pin`,
        # Dependabot version-updates with a cooldown). The organization's own rail
        # SHA-pins this same action; that is First-AI-Movers/.github's policy, not this
        # repository's, and importing it here would leave one SHA pin among sixty-odd
        # tag pins and silently sit outside the Dependabot flow that maintains them.
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AEOS_REVERT_APP_ID }}
          private-key: ${{ secrets.AEOS_REVERT_APP_PRIVATE_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install pytest

      - name: Determine record ID
        id: record
        env:
          # GitHub-context / dispatch-payload values via env (not inline ${{ }}) — zizmor
          # template-injection hardening. client_payload is attacker-influenceable; the
          # shape is still validated below before use.
          EVENT_NAME: ${{ github.event_name }}
          CLIENT_PAYLOAD_RECORD_ID: ${{ github.event.client_payload.record_id }}
          INPUT_RECORD_ID: ${{ inputs.record_id }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            RECORD_ID="$CLIENT_PAYLOAD_RECORD_ID"
          else
            RECORD_ID="$INPUT_RECORD_ID"
          fi

          if [ -z "$RECORD_ID" ]; then
            echo "::error::Missing Airtable record_id in payload or inputs"
            exit 1
          fi

          # Validate Airtable record ID shape: rec + 14+ alphanumeric chars
          if [[ ! "$RECORD_ID" =~ ^rec[a-zA-Z0-9]{14,}$ ]]; then
            echo "::error::Invalid Airtable record ID: $RECORD_ID"
            exit 1
          fi

          echo "record_id=$RECORD_ID" >> "$GITHUB_OUTPUT"
          echo "record_id=$RECORD_ID"

      - name: Ingest from Airtable (dry-run)
        if: env.INGEST_DRY_RUN == '1'
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          AIRTABLE_VIEW_NAME: ${{ secrets.AIRTABLE_VIEW_NAME }}
          RECORD_ID: ${{ steps.record.outputs.record_id }}
        run: |
          python3 tools/ingest_airtable.py \
            --dry-run \
            --record-id "$RECORD_ID" \
            --allow-no-status-gate

      - name: Ingest from Airtable (write)
        if: env.INGEST_DRY_RUN != '1'
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          AIRTABLE_VIEW_NAME: ${{ secrets.AIRTABLE_VIEW_NAME }}
          RECORD_ID: ${{ steps.record.outputs.record_id }}
        run: |
          python3 tools/ingest_airtable.py \
            --write \
            --record-id "$RECORD_ID"

      - name: Normalize tags to canonical topics
        if: env.INGEST_DRY_RUN != '1'
        run: python3 tools/normalize_tags.py

      - name: Check for duplicate article titles
        if: env.INGEST_DRY_RUN != '1'
        run: python3 tools/check_duplicate_titles.py

      - name: Rebuild index, sitemap, feed, corpus, docs, and static site
        if: env.INGEST_DRY_RUN != '1'
        env:
          INDEXNOW_API_KEY_ARTICLES_FAIM: ${{ secrets.INDEXNOW_API_KEY_ARTICLES_FAIM }}
        run: python3 tools/rebuild_local.py

      - name: Patch ROADMAP operational-state marker
        # rebuild_local.py only patches README.md and llms.txt; ROADMAP.md's
        # auto:operational-state block is patched by update_docs.py. Without
        # this step, test_check_mode_exits_zero_when_unchanged would fail
        # whenever ingestion changes the article count.
        if: env.INGEST_DRY_RUN != '1'
        run: python3 tools/update_docs.py

      - name: Export MCP archive data
        # Parity with ingest-airtable.yml: check_generated_artifacts.py rebuilds
        # mcp-server/src/generated/archive-data.json via export_mcp_data.py and
        # compares it against the committed copy. Without this step (and the
        # matching add-paths entry below) a dispatch PR that adds an article
        # would drift the bundled MCP snapshot and fail the Generated artifacts
        # `check` job.
        if: env.INGEST_DRY_RUN != '1'
        run: python3 tools/export_mcp_data.py

      - name: Run pytest
        if: env.INGEST_DRY_RUN != '1'
        run: python3 -m pytest tools/tests -v

      - name: Open PR for new article
        if: env.INGEST_DRY_RUN != '1'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app_token.outputs.token }}
          branch: ingest/airtable-record-${{ steps.record.outputs.record_id }}
          title: "ingest(article): add Airtable record ${{ steps.record.outputs.record_id }}"
          body: |
            Auto-generated PR from Airtable dispatch ingestion workflow (E20b).

            - Source: `${{ github.event_name }}`
            - Record ID: `${{ steps.record.outputs.record_id }}`
            - Validation: schema check, tag normalization, duplicate-title gate, pytest, rebuild

            **Do not merge until CI is green and the diff is reviewed.**

            ---
            _Opened with a short-lived GitHub App token, so this repository's CI runs on it automatically. If no checks appear, the App credentials are missing rather than the PR being stuck — see #388._
          commit-message: "ingest(article): add Airtable record ${{ steps.record.outputs.record_id }}"
          add-paths: |
            articles/*
            index.json
            sitemap.xml
            feed.xml
            feed.json
            llms.txt
            llms-index.txt
            llms-full.txt
            llms-recent.txt
            README.md
            ROADMAP.md
            mcp-server/src/generated/archive-data.json
