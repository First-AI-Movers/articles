name: Wayback snapshot

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max URLs to snapshot'
        required: false
        default: '8'
      sleep:
        description: 'Seconds between submissions'
        required: false
        default: '2'

permissions:
  contents: read

jobs:
  wayback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt

      - name: Dry-run snapshot list
        env:
          # workflow_dispatch inputs via env (not inline ${{ }}) — zizmor template-injection hardening.
          LIMIT: ${{ github.event.inputs.limit || '8' }}
        run: python3 tools/wayback_snapshot.py --dry-run --limit "$LIMIT"

      - name: Submit to Wayback Machine
        env:
          LIMIT: ${{ github.event.inputs.limit || '8' }}
          SLEEP: ${{ github.event.inputs.sleep || '2' }}
        run: |
          python3 tools/wayback_snapshot.py \
            --submit \
            --limit "$LIMIT" \
            --sleep "$SLEEP"
