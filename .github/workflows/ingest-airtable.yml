name: Ingest articles from Airtable

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  pull-requests: write

# Serialize ingestion runs. The cron and manual dispatches share the same
# rebuild artifacts (index.json, sitemap.xml, llms-*.txt) and PR branch
# (ingest/airtable-articles); without this group, two near-simultaneous
# runs would race on peter-evans/create-pull-request and rebuild output.
concurrency:
  group: ingest-airtable
  cancel-in-progress: false

env:
  INGEST_DRY_RUN: ${{ vars.INGEST_DRY_RUN || '1' }}
  # Production safety bounds for the daily cron.
  # INGEST_MAX_RECORDS caps how many records the script PAGES from Airtable
  # in one run. INGEST_MAX_CREATED caps how many article folders the script
  # actually CREATES in one run. Skips/dedupes/invalids do not count.
  # Defaults are conservative; tune via repo variables once steady-state.
  INGEST_MAX_RECORDS: ${{ vars.INGEST_MAX_RECORDS || '20' }}
  INGEST_MAX_CREATED: ${{ vars.INGEST_MAX_CREATED || '5' }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install pytest

      - name: Ingest from Airtable (dry-run)
        if: env.INGEST_DRY_RUN == '1'
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          AIRTABLE_VIEW_NAME: ${{ secrets.AIRTABLE_VIEW_NAME }}
        run: |
          python3 tools/ingest_airtable.py \
            --dry-run \
            --since-hours 72 \
            --limit "${INGEST_MAX_RECORDS}" \
            --max-created "${INGEST_MAX_CREATED}" \
            --allow-no-status-gate \
            --backfill-oldest

      - name: Ingest from Airtable (write)
        if: env.INGEST_DRY_RUN != '1'
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          AIRTABLE_VIEW_NAME: ${{ secrets.AIRTABLE_VIEW_NAME }}
        run: |
          python3 tools/ingest_airtable.py \
            --write \
            --since-hours 72 \
            --limit "${INGEST_MAX_RECORDS}" \
            --max-created "${INGEST_MAX_CREATED}" \
            --backfill-oldest

      - name: Read ingest summary (E41h)
        # tools/ingest_airtable.py emits ingest-summary.json with the
        # write-run counts. The downstream rebuild/PR/auto-merge steps
        # gate on `created != '0'` so the cron stops generating noise
        # PRs (incident #169) when no Airtable records were ingested.
        # If the summary file is missing for any reason, default to
        # `0` so we err on the side of not opening a PR.
        if: env.INGEST_DRY_RUN != '1'
        id: ingest_summary
        run: |
          if [ -f ingest-summary.json ]; then
            created=$(python3 -c 'import json; print(json.load(open("ingest-summary.json"))["created"])')
          else
            created=0
            echo "::warning::ingest-summary.json not found; treating created=0"
          fi
          echo "created=${created}" >> "$GITHUB_OUTPUT"
          echo "ingest summary: created=${created}"

      - name: Normalize tags to canonical topics
        if: env.INGEST_DRY_RUN != '1' && steps.ingest_summary.outputs.created != '0'
        run: python3 tools/normalize_tags.py

      - name: Check for duplicate article titles
        if: env.INGEST_DRY_RUN != '1' && steps.ingest_summary.outputs.created != '0'
        run: python3 tools/check_duplicate_titles.py

      - name: Rebuild index, sitemap, feed, corpus, docs, and static site
        if: env.INGEST_DRY_RUN != '1' && steps.ingest_summary.outputs.created != '0'
        env:
          INDEXNOW_API_KEY_ARTICLES_FAIM: ${{ secrets.INDEXNOW_API_KEY_ARTICLES_FAIM }}
        run: python3 tools/rebuild_local.py

      - name: Patch ROADMAP operational-state marker
        # rebuild_local.py only patches README.md and llms.txt; ROADMAP.md's
        # auto:operational-state block is patched by update_docs.py. Without
        # this step, test_check_mode_exits_zero_when_unchanged would fail
        # whenever ingestion changes the article count.
        if: env.INGEST_DRY_RUN != '1' && steps.ingest_summary.outputs.created != '0'
        run: python3 tools/update_docs.py

      - name: Export MCP archive data
        # tools/check_generated_artifacts.py also rebuilds
        # mcp-server/src/generated/archive-data.json via export_mcp_data.py
        # and compares against the committed version. Without this step the
        # newly ingested articles would land in index.json + llms-* on this
        # PR but the bundled MCP archive snapshot would still reflect the
        # pre-ingest article set, so the Generated artifacts CI job fails
        # on a real drift and auto-merge blocks. Stays inside the same
        # write-mode + non-zero-created gating as the rest of the rebuild
        # pipeline.
        if: env.INGEST_DRY_RUN != '1' && steps.ingest_summary.outputs.created != '0'
        run: python3 tools/export_mcp_data.py

      - name: Run pytest
        if: env.INGEST_DRY_RUN != '1' && steps.ingest_summary.outputs.created != '0'
        run: python3 -m pytest tools/tests -v

      - name: Open PR for new articles
        if: env.INGEST_DRY_RUN != '1' && steps.ingest_summary.outputs.created != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          # Prefer ARTICLE_INGESTION_PR_TOKEN so PR-create triggers downstream
          # CI; GitHub suppresses workflow runs on PRs created with the default
          # GITHUB_TOKEN to prevent recursion. Falls back to GITHUB_TOKEN when
          # the PAT is not provisioned (PR will need close/reopen for CI).
          token: ${{ secrets.ARTICLE_INGESTION_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: ingest/airtable-articles
          title: "ingest(articles): add articles from Airtable"
          body: |
            Auto-generated PR from Airtable ingestion workflow.

            - New articles ingested from Airtable
            - Tags normalized to canonical topics
            - Derived artifacts rebuilt (index.json, sitemap.xml, feeds, LLMS corpus)
            - Tests passing

            **Do not merge until CI is green and the diff is reviewed.**
          commit-message: "ingest(articles): add articles from Airtable"
          add-paths: |
            articles/*
            index.json
            sitemap.xml
            feed.xml
            feed.json
            llms.txt
            llms-index.txt
            llms-full.txt
            llms-recent.txt
            README.md
            ROADMAP.md
            mcp-server/src/generated/archive-data.json

      - name: Auto-merge clean ingestion PR (E41f)
        # Gated by AUTO_MERGE_INGESTION_PRS (default '0' — disabled). The
        # script is defensive: it verifies branch prefix, exact PR title,
        # file allowlist, mergeability, and required-check success before
        # squashing. Any blocker opens an `E41 auto-merge blocked` issue
        # rather than failing the cron loudly. Also gated on E41h's
        # `created != '0'` — when no records were ingested, no PR was
        # created so there is nothing for this step to merge.
        if: env.INGEST_DRY_RUN != '1' && steps.ingest_summary.outputs.created != '0'
        env:
          GH_TOKEN: ${{ secrets.ARTICLE_INGESTION_PR_TOKEN || secrets.GITHUB_TOKEN }}
          AUTO_MERGE_INGESTION_PRS: ${{ vars.AUTO_MERGE_INGESTION_PRS || '0' }}
        run: python3 tools/auto_merge_ingestion_pr.py

      - name: Open incident issue on cron-write failure
        # Fires only when the write-mode cron path fails. Skipped on dry-run
        # (no archive impact) and skipped on success. Logs the run URL,
        # commit, and dry-run state so the operator can investigate without
        # parsing logs. Never echoes secret values.
        if: failure() && env.INGEST_DRY_RUN != '1'
        env:
          GH_TOKEN: ${{ secrets.ARTICLE_INGESTION_PR_TOKEN || secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "E41 cron ingestion incident: workflow run ${{ github.run_id }} failed" \
            --body "$(cat <<EOF
          ## Cron write-mode ingestion failed

          - **Workflow run:** ${RUN_URL}
          - **Commit:** \`${GITHUB_SHA}\`
          - **Ref:** \`${GITHUB_REF}\`
          - **INGEST_DRY_RUN:** \`${INGEST_DRY_RUN}\`
          - **INGEST_MAX_RECORDS:** \`${INGEST_MAX_RECORDS}\`
          - **INGEST_MAX_CREATED:** \`${INGEST_MAX_CREATED}\`
          - **Trigger:** \`${GITHUB_EVENT_NAME}\`

          Investigate via the workflow logs at the run URL above. Confirm
          \`INGEST_DRY_RUN\` is restored to \`1\` if the failure left it in an
          inconsistent state (variable lives at repo level, not job level —
          this workflow does not flip it, but defense-in-depth checks are
          cheap).

          No secret values are recorded in this issue. Close once root cause
          is documented and any required code/workflow fix has shipped.
          EOF
          )"

      - name: Close stale incident issues on cron-write success
        # Closes any open `E41 cron ingestion incident:` issues left by
        # earlier failed cron runs. Only fires when:
        #   - the entire write-mode cron path completed successfully, AND
        #   - the trigger was `schedule` (workflow_dispatch keeps incidents
        #     open so an operator-led investigation can resolve them).
        # Mirrors the failure-path step's token fallback chain and never
        # echoes secret values. Title prefix is filtered exactly so this
        # cannot close unrelated issues that happen to mention the phrase.
        # Tolerant of token-scope limits: `gh issue close --comment` is
        # preferred (so the closing run is linked in-context) but falls
        # back to bare close when the token cannot call `addComment` —
        # observed on run 26708845288 where the cron token can create and
        # close issues but is not authorized for the `addComment`
        # GraphQL mutation. A per-issue failure logs a warning and moves
        # on; the step always exits 0 so cleanup-only errors cannot
        # turn an otherwise successful cron into a failed cron and re-
        # spawn the doom loop this step exists to break.
        if: success() && env.INGEST_DRY_RUN != '1' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.ARTICLE_INGESTION_PR_TOKEN || secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          mapfile -t ISSUES < <(
            gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --search 'in:title "E41 cron ingestion incident:"' \
              --limit 100 \
              --json number,title \
              --jq '.[] | select(.title | startswith("E41 cron ingestion incident:")) | .number'
          )
          if [ "${#ISSUES[@]}" -eq 0 ]; then
            echo "No open E41 cron ingestion incident issues to close."
            exit 0
          fi
          echo "Closing ${#ISSUES[@]} stale E41 cron ingestion incident issue(s)."
          for n in "${ISSUES[@]}"; do
            if gh issue close "$n" \
                --repo "${GITHUB_REPOSITORY}" \
                --comment "Closed automatically by successful scheduled cron run: ${RUN_URL}"; then
              echo "Closed issue #${n} with comment."
            else
              echo "WARN: close-with-comment failed for #${n}; trying bare close."
              if gh issue close "$n" --repo "${GITHUB_REPOSITORY}"; then
                echo "Closed issue #${n} without comment."
              else
                echo "WARN: failed to close issue #${n}; leaving it for manual cleanup."
              fi
            fi
          done
          # Cleanup is best-effort: a stale-issue close failure must never
          # turn this cron run into a failure() and trigger the failure-
          # path step (which would file yet another incident issue).
          exit 0
