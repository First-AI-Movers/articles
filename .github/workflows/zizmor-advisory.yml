name: Zizmor (advisory)

# Advisory GitHub Actions workflow-security scan (ARTICLES-ZIZMOR-SCOPED-ADVISORY-A).
# ADVISORY / NON-REQUIRED — findings never block a merge; the workflow-security layer of the
# scanner stack, propagated from agent-toolkit / public-innovation-eu / radar.engine. Collects
# a classification ledger before any required-gate promotion (a separate, governed decision).
#
# Posture: GitHub-hosted; pull_request (NOT pull_request_target) so the token is read-only;
# scoped to workflow / zizmor-config changes; contents: read only; no secrets; zizmor CLI
# (pinned, from PyPI) run OFFLINE (no token, no online audits, no Docker). Action pins use
# Articles' governed major-version tags (@vN + Dependabot), matching SECURITY.md — NOT SHA.
# `unpinned-uses` is set to ref-pin in .github/zizmor.yml to honor that policy; all other
# audits stay active.
#
# Advisory mechanism: zizmor exits non-zero when it finds issues. We capture that and exit 0
# (findings are advisory). A genuine tool/exec failure (no JSON report produced) exits
# non-zero so a broken pilot is VISIBLE — the job is non-required, so it never blocks a merge.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zizmor-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor-advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install zizmor (pinned, PyPI)
        run: pip install "zizmor==1.25.2"
      - name: Run zizmor (advisory, offline)
        run: |
          set +e
          zizmor --offline --format=json-v1 . > zizmor-report.json
          zizmor --offline --format=plain . | tee zizmor-report.txt
          set -e
          if [ ! -s zizmor-report.json ]; then
            echo "::error::zizmor produced no JSON report — tool/exec failure (not 'findings present')"
            exit 1
          fi
          count="$(python3 -c "import json; print(len(json.load(open('zizmor-report.json'))))" 2>/dev/null || echo '?')"
          echo "zizmor advisory scan complete — findings: ${count} (advisory, non-blocking)."
          echo "Triage into docs/ZIZMOR_ADVISORY_ROLLOUT_2026_06.md; this job is non-required."
          exit 0
      - name: Upload zizmor report (advisory evidence)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zizmor-advisory-report
          path: |
            zizmor-report.txt
            zizmor-report.json
          if-no-files-found: warn
          retention-days: 14
