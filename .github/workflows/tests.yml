name: Run tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install pytest

      - name: Run pytest
        run: python3 -m pytest tools/tests -v

      # docs/CHANGELOG.md is a manual-reviewed snapshot (tools/build_changelog.py,
      # refreshed by hand and reviewed in a PR). It is deliberately NOT checked
      # here: every squash merge to protected main adds a "(#N)" commit that only
      # a later PR can carry into the snapshot, so a freshness check is red on
      # every PR opened after a merge -- including every Dependabot head (#432)
      # -- and never a verdict on the PR under test. Refresh it locally with
      # `python3 tools/build_changelog.py`; `--check` remains a local tool.

      - name: Check for duplicate article titles
        run: python3 tools/check_duplicate_titles.py

      - name: Validate errata files
        run: python3 tools/check_errata.py

      - name: Check active-default Python drift
        # Fails if an active selector re-introduces a retired default (3.11/3.12/
        # 3.13) or bypasses .python-version. The pytest suite proves this guard
        # actually fires; this step is what a contributor sees when it does.
        run: python3 tools/check_python_runtime_drift.py
