name: Run tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install pytest

      - name: Run pytest
        run: python3 -m pytest tools/tests -v

      - name: Check changelog freshness
        # Changelog is a manual-reviewed snapshot. It should be current before
        # merging a PR, but after a squash merge to protected main, the new
        # merge commit cannot be represented without opening another PR.
        # This check enforces freshness on PRs only, keeping main-push green.
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: python3 tools/build_changelog.py --check

      - name: Check for duplicate article titles
        run: python3 tools/check_duplicate_titles.py

      - name: Validate errata files
        run: python3 tools/check_errata.py

      - name: Check active-default Python drift
        # Fails if an active selector re-introduces a retired default (3.11/3.12/
        # 3.13) or bypasses .python-version. The pytest suite proves this guard
        # actually fires; this step is what a contributor sees when it does.
        run: python3 tools/check_python_runtime_drift.py
