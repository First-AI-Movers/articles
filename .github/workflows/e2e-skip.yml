name: E2E tests

# Pure-docs / ROADMAP-only "skip" workflow. Reports success for the
# required `e2e` status check when the heavy `e2e.yml` workflow is
# intentionally skipped by its `paths-ignore` filter. Branch protection
# on `main` requires the `e2e` job context; without this satisfier,
# legitimate docs-only PRs (e.g. ROADMAP-only closeouts like PR #182)
# cannot merge because the required check never reports.
#
# This workflow runs only on the *inverse* path set (ROADMAP.md and
# docs/**) and exits in seconds with no toolchain install. Its `e2e`
# job name matches the heavy workflow's job name so branch protection
# is satisfied by whichever workflow actually triggers for the PR.
#
# Surfaced during N2 verification 2026-05-15; canonized as N6.

on:
  pull_request:
    paths:
      - 'ROADMAP.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Pure-docs PR — heavy E2E intentionally skipped
        run: |
          echo "::notice::Pure-docs PR (ROADMAP.md or docs/** only)."
          echo "::notice::Heavy Playwright E2E suite intentionally skipped."
          echo "::notice::Branch-protection required check 'e2e' satisfied by this skip-workflow."
