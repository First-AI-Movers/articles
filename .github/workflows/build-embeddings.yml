name: Build embedding index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"   # Weekly on Sunday 03:17 UTC

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install pytest

      - name: Cache embedding model
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-embeddings-model-${{ hashFiles('tools/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-embeddings-model-

      - name: Build embeddings
        run: python3 tools/build_embeddings.py --out embeddings.parquet

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: embeddings-parquet
          path: embeddings.parquet
          retention-days: 7

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/refresh-embeddings
          title: "chore(embeddings): refresh article embedding index"
          body: |
            Automated weekly refresh of `embeddings.parquet`.
            - Model: `BAAI/bge-small-en-v1.5`
            - Trigger: scheduled workflow
            - If no semantic changes, this PR may be empty.
          commit-message: "chore(embeddings): refresh article embedding index"
          delete-branch: true
