name: Build embedding index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"   # Weekly on Sunday 03:17 UTC

# create-pull-request needs write on contents (to push the branch) and
# pull-requests (to open the PR). The prior `contents: read` made every
# scheduled run's "Open PR if changed" step fail on token scope — the
# refresh never landed. issues:write scopes the failure-incident step.
permissions:
  contents: read
  pull-requests: read
  issues: write

# Serialize scheduled + manual runs: both write the same
# `chore/refresh-embeddings` branch and the same embeddings.parquet.
concurrency:
  group: build-embeddings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert the App credentials are visible
        # FAIL FAST, AND FAIL WHERE THE CAUSE IS NAMED (#388).
        #
        # The root cause was not simply an expired credential. It was that
        # `${{ secrets.PAT || secrets.GITHUB_TOKEN }}` falls back on EMPTY and never on
        # INVALID: an expired PAT stays truthy, so the fallback never fired and the job died
        # much later inside a third-party action with `fatal: could not read Username`.
        #
        # UNCONDITIONAL ON PURPOSE. Checking only on the branch that publishes would repeat the
        # exact way this hid: `ingest-airtable` reported green for three weeks after the
        # credential died, because on days with no new records it never reached the step that
        # needed it. A publication workflow that cannot publish should say so on the first run,
        # not on the first run that had something to say.
        env:
          APP_ID_PRESENT: ${{ vars.AEOS_REVERT_APP_ID != '' }}
          APP_KEY_PRESENT: ${{ secrets.AEOS_REVERT_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$APP_ID_PRESENT" != "true" ] || [ "$APP_KEY_PRESENT" != "true" ]; then
            echo "::error::AEOS_REVERT_APP_ID (org variable) or AEOS_REVERT_APP_PRIVATE_KEY (org secret) is not visible to this repository, so no PR can be published. The secret's visibility is 'selected repositories'; First-AI-Movers/articles must be added to it."
            exit 1
          fi
          echo "App id and private key are both visible to this repository."

      - name: Mint a short-lived App token for branch and PR publication
        # SHORT-LIVED, REPOSITORY-SCOPED, NOT A PAT (#388). This installation token expires in
        # about an hour and is scoped to this repository by default -- `owner` and
        # `repositories` are deliberately omitted. It replaces ARTICLE_INGESTION_PR_TOKEN, a
        # personal access token stored 2026-05-03 that went invalid around 2026-08-02 and broke
        # every publishing workflow in this repository without raising an alert.
        #
        # AN APP TOKEN RATHER THAN GITHUB_TOKEN, for a mechanical reason: GitHub suppresses
        # workflow runs on a PR created with the default GITHUB_TOKEN, to prevent recursion. A
        # PR opened that way would never run `aeos-merge-ready` -- the organization's only
        # required check -- and so could never merge. Working around that is exactly why a PAT
        # was here; an App token has the same property with none of the lifetime.
        #
        # Same App, action and pin the organization already trusts for the post-main automatic
        # revert rail (First-AI-Movers/.github `aeos-main-smoke.yml`).
        id: app_token
        # PINNED BY MAJOR-VERSION TAG, matching this repository's governed convention
        # (SECURITY.md "Dependencies", .github/zizmor.yml `unpinned-uses: ref-pin`,
        # Dependabot version-updates with a cooldown). The organization's own rail
        # SHA-pins this same action; that is First-AI-Movers/.github's policy, not this
        # repository's, and importing it here would leave one SHA pin among sixty-odd
        # tag pins and silently sit outside the Dependabot flow that maintains them.
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AEOS_REVERT_APP_ID }}
          private-key: ${{ secrets.AEOS_REVERT_APP_PRIVATE_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install pytest

      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-embeddings-model-${{ hashFiles('tools/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-embeddings-model-

      - name: Build embeddings
        run: python3 tools/build_embeddings.py --out embeddings.parquet

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: embeddings-parquet
          path: embeddings.parquet
          retention-days: 7

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          # The App token minted above, not GITHUB_TOKEN: GitHub suppresses workflow runs on a
          # PR created with the default token, so the required `aeos-merge-ready` check would
          # never run and the PR could never merge. No fallback -- see the mint step (#388).
          token: ${{ steps.app_token.outputs.token }}
          branch: chore/refresh-embeddings
          title: "chore(embeddings): refresh article embedding index"
          body: |
            Automated weekly refresh of `embeddings.parquet`.
            - Model: `BAAI/bge-small-en-v1.5`
            - Trigger: scheduled workflow
            - If no semantic changes, this PR may be empty (peter-evans skips it).

            _Opened with a short-lived GitHub App token, so this repository's CI runs on it
            automatically. If no checks appear, the App credentials are missing rather than
            the PR being stuck — see #388._
          commit-message: "chore(embeddings): refresh article embedding index"
          add-paths: |
            embeddings.parquet
          delete-branch: true

      - name: Open incident issue on scheduled failure
        # Fires only when a scheduled run fails, so a silent weekly breakage
        # (the prior under-permissioned state ran red 11/11 with no signal)
        # becomes operator-visible. Deduplicated: skips if an open incident
        # already tracks it. workflow_dispatch failures are left for the
        # operator who triggered them. Never echoes secret values; always
        # exits 0 so incident bookkeeping cannot re-fail the run.
        if: failure() && github.event_name == 'schedule'
        env:
          # DELIBERATELY GITHUB_TOKEN, NOT THE APP TOKEN (#388). This step reports that the
          # work above failed. Sharing a credential with the work it watches is what silenced
          # it: the publish died at `git push` and this step died at `HTTP 401 Bad
          # credentials`, so consecutive daily failures produced no issue and nobody was told.
          # An alarm must not depend on the subject it alarms about. GITHUB_TOKEN is minted per
          # run and cannot expire.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          TITLE_PREFIX="Embeddings refresh failed"
          existing=$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --search "in:title \"${TITLE_PREFIX}\"" \
            --limit 1 \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Open incident #${existing} already tracks embeddings failures; not duplicating."
            exit 0
          fi
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TITLE_PREFIX}: weekly embeddings workflow run failed" \
            --body "$(cat <<EOF
          ## Weekly embeddings refresh failed

          - **Workflow run:** ${RUN_URL}
          - **Commit:** \`${GITHUB_SHA}\`
          - **Trigger:** \`${GITHUB_EVENT_NAME}\`

          \`embeddings.parquet\` was not refreshed this cycle. Investigate via the
          run URL above. No secret values are recorded in this issue. Close once
          the root cause is resolved and a refresh has landed.
          EOF
          )"
          exit 0
