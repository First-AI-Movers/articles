name: Recover Airtable backlog

# Operator/AI-driven, bounded recovery of the aged-out `Posted` Airtable backlog.
# workflow_dispatch only (no cron): each run recovers ONE deterministic batch of
# the oldest valid missing records, rebuilds all derived artifacts, and opens a
# `backfill/airtable-posted-batch-NN` PR. It NEVER auto-merges (the operator/AI
# exact-head merges each batch) and NEVER writes Airtable or generates summaries.
#
# Drain the backlog by dispatching sequential batches: merge batch NN before
# dispatching NN+1 so the next run sees the just-merged articles in the archive
# and selects the next-oldest missing set.

on:
  workflow_dispatch:
    inputs:
      batch_number:
        description: "Batch label NN for the branch/title (e.g. 01, 02)."
        required: true
        default: "01"
        type: string
      batch_size:
        description: "Records to recover this batch (1..5; hard max 5)."
        required: true
        default: "5"
        type: string
      apply:
        description: "false = dry-run (report only); true = write + open PR."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  pull-requests: read

# Serialize recovery runs: they share the rebuild artifacts and must not race
# create-pull-request. Never cancel a half-written run in progress.
concurrency:
  group: recover-airtable-backlog
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert the App credentials are visible
        # FAIL FAST, AND FAIL WHERE THE CAUSE IS NAMED (#388).
        #
        # The root cause was not simply an expired credential. It was that
        # `${{ secrets.PAT || secrets.GITHUB_TOKEN }}` falls back on EMPTY and never on
        # INVALID: an expired PAT stays truthy, so the fallback never fired and the job died
        # much later inside a third-party action with `fatal: could not read Username`.
        #
        # UNCONDITIONAL ON PURPOSE. Checking only on the branch that publishes would repeat the
        # exact way this hid: `ingest-airtable` reported green for three weeks after the
        # credential died, because on days with no new records it never reached the step that
        # needed it. A publication workflow that cannot publish should say so on the first run,
        # not on the first run that had something to say.
        env:
          APP_ID_PRESENT: ${{ vars.AEOS_REVERT_APP_ID != '' }}
          APP_KEY_PRESENT: ${{ secrets.AEOS_REVERT_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$APP_ID_PRESENT" != "true" ] || [ "$APP_KEY_PRESENT" != "true" ]; then
            echo "::error::AEOS_REVERT_APP_ID (org variable) or AEOS_REVERT_APP_PRIVATE_KEY (org secret) is not visible to this repository, so no PR can be published. The secret's visibility is 'selected repositories'; First-AI-Movers/articles must be added to it."
            exit 1
          fi
          echo "App id and private key are both visible to this repository."

      - name: Mint a short-lived App token for branch and PR publication
        # SHORT-LIVED, REPOSITORY-SCOPED, NOT A PAT (#388). This installation token expires in
        # about an hour and is scoped to this repository by default -- `owner` and
        # `repositories` are deliberately omitted. It replaces ARTICLE_INGESTION_PR_TOKEN, a
        # personal access token stored 2026-05-03 that went invalid around 2026-08-02 and broke
        # every publishing workflow in this repository without raising an alert.
        #
        # AN APP TOKEN RATHER THAN GITHUB_TOKEN, for a mechanical reason: GitHub suppresses
        # workflow runs on a PR created with the default GITHUB_TOKEN, to prevent recursion. A
        # PR opened that way would never run `aeos-merge-ready` -- the organization's only
        # required check -- and so could never merge. Working around that is exactly why a PAT
        # was here; an App token has the same property with none of the lifetime.
        #
        # Same App, action and pin the organization already trusts for the post-main automatic
        # revert rail (First-AI-Movers/.github `aeos-main-smoke.yml`).
        id: app_token
        # PINNED BY MAJOR-VERSION TAG, matching this repository's governed convention
        # (SECURITY.md "Dependencies", .github/zizmor.yml `unpinned-uses: ref-pin`,
        # Dependabot version-updates with a cooldown). The organization's own rail
        # SHA-pins this same action; that is First-AI-Movers/.github's policy, not this
        # repository's, and importing it here would leave one SHA pin among sixty-odd
        # tag pins and silently sit outside the Dependabot flow that maintains them.
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AEOS_REVERT_APP_ID }}
          private-key: ${{ secrets.AEOS_REVERT_APP_PRIVATE_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install pytest

      - name: Recover backlog (dry-run)
        if: inputs.apply != 'true'
        env:
          # GitHub-context input via env (not inline ${{ }}) — template-injection
          # hardening (zizmor), matching e2e.yml / generated-artifacts.yml.
          BATCH_SIZE: ${{ inputs.batch_size }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          AIRTABLE_VIEW_NAME: ${{ secrets.AIRTABLE_VIEW_NAME }}
        run: |
          python3 tools/recover_airtable_backlog.py \
            --batch-size "$BATCH_SIZE" \
            --manifest-file recover-manifest.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Recover backlog (apply)
        if: inputs.apply == 'true'
        env:
          BATCH_SIZE: ${{ inputs.batch_size }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          AIRTABLE_VIEW_NAME: ${{ secrets.AIRTABLE_VIEW_NAME }}
        run: |
          python3 tools/recover_airtable_backlog.py \
            --batch-size "$BATCH_SIZE" \
            --apply \
            --manifest-file recover-manifest.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Read recovery summary
        # Parse `created` so the rebuild/PR tail only runs on an apply that
        # actually wrote articles. Missing manifest -> created=0 (open no PR).
        id: rec
        run: |
          if [ -f recover-manifest.json ]; then
            created=$(python3 -c 'import json; print(json.load(open("recover-manifest.json"))["counts"]["created"])')
          else
            created=0
            echo "::warning::recover-manifest.json not found; treating created=0"
          fi
          echo "created=${created}" >> "$GITHUB_OUTPUT"
          echo "recovery summary: created=${created}"

      - name: Normalize tags to canonical topics
        if: inputs.apply == 'true' && steps.rec.outputs.created != '0'
        run: python3 tools/normalize_tags.py

      - name: Check for duplicate article titles
        if: inputs.apply == 'true' && steps.rec.outputs.created != '0'
        run: python3 tools/check_duplicate_titles.py

      - name: Rebuild index, sitemap, feed, corpus, docs, and static site
        if: inputs.apply == 'true' && steps.rec.outputs.created != '0'
        env:
          INDEXNOW_API_KEY_ARTICLES_FAIM: ${{ secrets.INDEXNOW_API_KEY_ARTICLES_FAIM }}
        run: python3 tools/rebuild_local.py

      - name: Patch ROADMAP operational-state marker
        if: inputs.apply == 'true' && steps.rec.outputs.created != '0'
        run: python3 tools/update_docs.py

      - name: Export MCP archive data
        if: inputs.apply == 'true' && steps.rec.outputs.created != '0'
        run: python3 tools/export_mcp_data.py

      - name: Run pytest
        if: inputs.apply == 'true' && steps.rec.outputs.created != '0'
        run: python3 -m pytest tools/tests -v

      - name: Public-surface safety scan
        # Defense in depth (gitleaks is the deeper net on the PR): fail if any
        # Airtable secret value leaked into the generated content. `-q` never
        # prints the match, so a positive result cannot echo the secret.
        if: inputs.apply == 'true' && steps.rec.outputs.created != '0'
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          set -euo pipefail
          scan_paths="articles index.json sitemap.xml feed.xml feed.json llms.txt llms-index.txt llms-full.txt llms-recent.txt README.md ROADMAP.md mcp-server/src/generated/archive-data.json"
          if [ -n "${AIRTABLE_BASE_ID:-}" ] && grep -rqIF -- "$AIRTABLE_BASE_ID" $scan_paths 2>/dev/null; then
            echo "::error::Airtable base id found in generated content"; exit 1
          fi
          if [ -n "${AIRTABLE_PAT:-}" ] && grep -rqIF -- "$AIRTABLE_PAT" $scan_paths 2>/dev/null; then
            echo "::error::Airtable PAT found in generated content"; exit 1
          fi
          echo "public-surface scan: clean"

      - name: Open backlog batch PR
        if: inputs.apply == 'true' && steps.rec.outputs.created != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          # The App token minted above, not GITHUB_TOKEN: GitHub suppresses workflow runs on a
          # PR created with the default token, so the required `aeos-merge-ready` check would
          # never run and the PR could never merge. No fallback -- see the mint step (#388).
          token: ${{ steps.app_token.outputs.token }}
          branch: backfill/airtable-posted-batch-${{ inputs.batch_number }}
          title: "ingest(articles): recover missed Airtable batch ${{ inputs.batch_number }}"
          commit-message: "ingest(articles): recover missed Airtable batch ${{ inputs.batch_number }}"
          body: |
            Bounded recovery of the aged-out Airtable `Posted` backlog
            (batch ${{ inputs.batch_number }}). Auto-generated by
            `recover-airtable-backlog.yml`; do NOT auto-merge — review the diff,
            confirm CI is green, then exact-head merge.

            - Recovered the oldest valid missing `Posted` records (deterministic,
              hard-capped at 5/batch)
            - Tags normalized; derived artifacts rebuilt (index/sitemap/feeds/LLMS
              corpus/MCP archive); tests passing
            - Counts only; no article bodies or private source data in this PR body
          add-paths: |
            articles/*
            index.json
            sitemap.xml
            feed.xml
            feed.json
            llms.txt
            llms-index.txt
            llms-full.txt
            llms-recent.txt
            README.md
            ROADMAP.md
            mcp-server/src/generated/archive-data.json
