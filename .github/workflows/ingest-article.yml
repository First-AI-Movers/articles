name: Ingest article from external push

on:
  repository_dispatch:
    types: [new-article]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Share the `ingest-airtable` concurrency group with the cron + dispatch
# ingestion workflows. All three rebuild the same generated artifacts
# (index.json, sitemap.xml, feeds, llms-*, archive-data.json); without a
# shared group an external push could run concurrently with the daily cron
# and race on the rebuild output.
concurrency:
  group: ingest-airtable
  cancel-in-progress: false

env:
  PAYLOAD_FILE: /tmp/external_article_payload.json

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert the App credentials are visible
        # FAIL FAST, AND FAIL WHERE THE CAUSE IS NAMED (#388).
        #
        # The root cause was not simply an expired credential. It was that
        # `${{ secrets.PAT || secrets.GITHUB_TOKEN }}` falls back on EMPTY and never on
        # INVALID: an expired PAT stays truthy, so the fallback never fired and the job died
        # much later inside a third-party action with `fatal: could not read Username`.
        #
        # UNCONDITIONAL ON PURPOSE. Checking only on the branch that publishes would repeat the
        # exact way this hid: `ingest-airtable` reported green for three weeks after the
        # credential died, because on days with no new records it never reached the step that
        # needed it. A publication workflow that cannot publish should say so on the first run,
        # not on the first run that had something to say.
        env:
          APP_ID_PRESENT: ${{ vars.AEOS_REVERT_APP_ID != '' }}
          APP_KEY_PRESENT: ${{ secrets.AEOS_REVERT_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$APP_ID_PRESENT" != "true" ] || [ "$APP_KEY_PRESENT" != "true" ]; then
            echo "::error::AEOS_REVERT_APP_ID (org variable) or AEOS_REVERT_APP_PRIVATE_KEY (org secret) is not visible to this repository, so no PR can be published. The secret's visibility is 'selected repositories'; First-AI-Movers/articles must be added to it."
            exit 1
          fi
          echo "App id and private key are both visible to this repository."

      - name: Mint a short-lived App token for branch and PR publication
        # SHORT-LIVED, REPOSITORY-SCOPED, NOT A PAT (#388). This installation token expires in
        # about an hour and is scoped to this repository by default -- `owner` and
        # `repositories` are deliberately omitted. It replaces ARTICLE_INGESTION_PR_TOKEN, a
        # personal access token stored 2026-05-03 that went invalid around 2026-08-02 and broke
        # every publishing workflow in this repository without raising an alert.
        #
        # AN APP TOKEN RATHER THAN GITHUB_TOKEN, for a mechanical reason: GitHub suppresses
        # workflow runs on a PR created with the default GITHUB_TOKEN, to prevent recursion. A
        # PR opened that way would never run `aeos-merge-ready` -- the organization's only
        # required check -- and so could never merge. Working around that is exactly why a PAT
        # was here; an App token has the same property with none of the lifetime.
        #
        # Same App, action and pin the organization already trusts for the post-main automatic
        # revert rail (First-AI-Movers/.github `aeos-main-smoke.yml`).
        id: app_token
        # SHA-PINNED per AGENTS.md: a `.github/workflows/**` change must "pin every
        # non-local `uses:` to a 40-hex commit SHA". Same pin the organization's own
        # post-main revert rail uses for this action.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AEOS_REVERT_APP_ID }}
          private-key: ${{ secrets.AEOS_REVERT_APP_PRIVATE_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install Python dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install pytest

      - name: Write payload file (repository_dispatch)
        # Pass the dispatch payload through an env var rather than
        # interpolating ${{ toJson(...) }} directly into the shell command.
        # The previous shape allowed a crafted client_payload containing
        # shell-significant characters (`, ", $, ;) to break out of the
        # bash double-quoted string and execute on the runner. The single-
        # quoted heredoc disables shell expansion of the Python body, and
        # the payload bytes only reach Python via os.environ.
        if: github.event_name == 'repository_dispatch'
        env:
          CLIENT_PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(os.environ["CLIENT_PAYLOAD_JSON"])
          payload_file = Path(os.environ["PAYLOAD_FILE"])
          payload_file.write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8",
          )
          PY


      - name: Use fixture payload (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: cp tools/fixtures/external_article_payload.json "$PAYLOAD_FILE"

      - name: Ingest article
        # ingest_article.py runs its own schema validation before writing,
        # so a preceding unconditional --dry-run pass would be redundant.
        # If a dispatch needs a debug preview, run --dry-run locally with
        # the payload file before triggering the workflow.
        run: python3 tools/ingest_article.py --payload-file "$PAYLOAD_FILE" --write

      - name: Normalize tags to canonical topics
        run: python3 tools/normalize_tags.py

      - name: Check for duplicate article titles
        run: python3 tools/check_duplicate_titles.py

      - name: Rebuild index, sitemap, feed, corpus, docs, and static site
        env:
          INDEXNOW_API_KEY_ARTICLES_FAIM: ${{ secrets.INDEXNOW_API_KEY_ARTICLES_FAIM }}
        run: python3 tools/rebuild_local.py

      - name: Export MCP archive data
        # Parity with the cron + dispatch ingestion workflows: refreshes
        # mcp-server/src/generated/archive-data.json so a new article does not
        # drift the bundled MCP snapshot and fail the Generated artifacts `check`.
        run: python3 tools/export_mcp_data.py

      - name: Run pytest
        run: python3 -m pytest tools/tests -v

      - name: Extract article info for PR
        id: info
        run: |
          SLUG=$(python3 -c "import json; print(json.load(open('$PAYLOAD_FILE')).get('slug','unknown'))")
          TITLE=$(python3 -c "import json; print(json.load(open('$PAYLOAD_FILE')).get('title','Unknown'))")
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Open PR for new article
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app_token.outputs.token }}
          branch: ingest/external-article-${{ steps.info.outputs.slug }}
          title: "ingest(article): add ${{ steps.info.outputs.title }}"
          body: |
            Auto-generated PR from external article ingestion workflow.

            - Source: `repository_dispatch` / `workflow_dispatch`
            - Slug: `${{ steps.info.outputs.slug }}`
            - Validation: schema check, tag normalization, duplicate-title gate, pytest, rebuild

            **Do not merge until CI is green and the diff is reviewed.**

            ---
            _Opened with a short-lived GitHub App token, so this repository's CI runs on it automatically. If no checks appear, the App credentials are missing rather than the PR being stuck — see #388._
          commit-message: "ingest(article): add ${{ steps.info.outputs.title }}"
          add-paths: |
            articles/*
            index.json
            sitemap.xml
            feed.xml
            feed.json
            llms.txt
            llms-index.txt
            llms-full.txt
            llms-recent.txt
            README.md
            mcp-server/src/generated/archive-data.json
