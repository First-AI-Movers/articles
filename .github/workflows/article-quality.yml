name: Article quality audit

on:
  pull_request:
    # Vale binary + Lychee link-check + readability scoring run against
    # articles/ — skip pure-docs / ROADMAP edits. Article markdown IS
    # content and DOES trigger this audit (N6, 2026-05-15). Weekly cron
    # still covers the full corpus regardless.
    paths-ignore:
      - 'ROADMAP.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - 'ROADMAP.md'
      - 'docs/**'
  workflow_dispatch:
  schedule:
    # Weekly full-corpus check: Sundays at 04:17 UTC
    - cron: "17 4 * * 0"

permissions:
  contents: read

jobs:
  readability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt

      - name: Run readability audit
        run: python3 tools/readability.py --articles-dir articles --json-out readability_report.json --md-out readability_report.md

      - name: Upload readability reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readability-reports
          path: |
            readability_report.json
            readability_report.md

  vale:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Vale
        run: |
          wget -qO- https://github.com/errata-ai/vale/releases/download/v3.11.2/vale_3.11.2_Linux_64-bit.tar.gz | tar xz -C /tmp
          sudo mv /tmp/vale /usr/local/bin/vale
          vale --version

      - name: Run Vale on articles and docs
        run: |
          mkdir -p vale-report
          vale --output=line articles docs README.md > vale-report/vale.log 2>&1 || true
          vale --output=JSON articles docs README.md > vale-report/vale.json 2>&1 || true
        continue-on-error: true

      - name: Upload Vale report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vale-report
          path: vale-report/

  lychee:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: --config .lychee.toml
          fail: false
        continue-on-error: true

      - name: Upload Lychee report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lychee-report
          path: lychee/out.md
