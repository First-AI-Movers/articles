name: MCP Server

on:
  pull_request:
    paths:
      - 'mcp-server/**'
      - 'tools/export_mcp_data.py'
      - '.github/workflows/mcp-server.yml'
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - 'tools/export_mcp_data.py'
      - '.github/workflows/mcp-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job id is `mcp-server` (not `test`) so its check-run context does NOT
  # collide with tests.yml's branch-protection-required `test` context.
  # GitHub resolves duplicate same-named required contexts ambiguously
  # (last reporter wins), which can mask a red producer behind a green one.
  # Mirrors og-worker.yml's `og-worker` per-worker job-id convention.
  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build (dry-run)
        run: npm run build

  export-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install Python dependencies
        run: |
          pip install pyarrow pytest

      - name: Run export data tests
        run: python3 -m pytest tools/tests/test_export_mcp_data.py -v

      - name: Verify generated data is up to date
        run: |
          python3 tools/export_mcp_data.py --check

  deploy:
    needs: [mcp-server, export-data]
    runs-on: ubuntu-latest
    # The job runs on every main push and on a manual `workflow_dispatch` of
    # main, inside the `mcp-deploy` environment (GitHub creates it on first
    # use). Dispatch lets a release or a credential rotation redeploy without a
    # code change; a dispatch of any other ref is still skipped (#508). Environment secrets exist only after
    # the job has started, and a job-level `if:` cannot read `secrets.*`, so
    # whether the two Cloudflare inputs are present is decided by the first
    # step. When either is absent every later step is skipped, the job ends
    # green, and no Cloudflare call is made. The inputs themselves are the
    # switch: there is no repository variable to flip.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: mcp-deploy
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: Check deploy inputs
        id: inputs
        # The job's default working directory does not exist before checkout.
        working-directory: .
        env:
          # A boolean computed from the secrets, never the secret values
          # themselves, so the guard step cannot leak or use a credential.
          INPUTS_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$INPUTS_PRESENT" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy inputs absent::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set in the mcp-deploy environment; skipping the deploy. No Cloudflare call was made."
          fi

      - if: steps.inputs.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: steps.inputs.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        if: steps.inputs.outputs.present == 'true'
        run: npm ci

      - name: Deploy to Cloudflare Workers
        if: steps.inputs.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
