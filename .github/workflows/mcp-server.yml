name: MCP Server

on:
  pull_request:
    paths:
      - 'mcp-server/**'
      - 'tools/export_mcp_data.py'
      - '.github/workflows/mcp-server.yml'
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - 'tools/export_mcp_data.py'
      - '.github/workflows/mcp-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build (dry-run)
        run: npm run build

  export-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyarrow pytest

      - name: Run export data tests
        run: python3 -m pytest tools/tests/test_export_mcp_data.py -v

      - name: Verify generated data is up to date
        run: |
          python3 tools/export_mcp_data.py --check

  deploy:
    needs: [test, export-data]
    runs-on: ubuntu-latest
    # Gate at the job level so no runner spins up unless deployment is
    # actually intended. The Cloudflare credential check stays inside the
    # run step as defense in depth (a configured `MCP_DEPLOY_ENABLED` with
    # missing tokens is an operator misconfiguration, not a successful
    # deploy). Conditions are AND-joined; all must hold.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (vars.MCP_DEPLOY_ENABLED == '1' || vars.MCP_DEPLOY_ENABLED == 'true')
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::MCP_DEPLOY_ENABLED is set but Cloudflare credentials are missing"
            exit 1
          fi
          npm run deploy
