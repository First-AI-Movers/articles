name: E2E tests

on:
  pull_request:
    # Skip pure-docs / roadmap-only PRs — full Chromium install + 32 browser
    # tests provide no signal on a ROADMAP or `docs/**` edit. Article markdown
    # IS content and DOES trigger e2e (N6, 2026-05-15). Nightly cron still
    # covers main as the canary. Required-check `e2e` is satisfied on
    # pure-docs PRs by the sibling `e2e-skip.yml` workflow.
    paths-ignore:
      - 'ROADMAP.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - 'ROADMAP.md'
      - 'docs/**'
  schedule:
    # Nightly at 06:00 UTC — low-noise canary
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install pytest

      - name: Build static site
        run: python3 tools/rebuild_local.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
