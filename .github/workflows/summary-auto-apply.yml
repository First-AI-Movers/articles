name: Summary Auto-Apply

# Envelope A8 of the summary-CI-automation rollout: a MANUAL, fresh-article-only
# summary apply path. It generates summaries for recently-published
# missing-summary articles, applies ONLY dual-verifier AUTO_APPROVE metadata,
# rebuilds the deterministic artifacts in-job, and opens a PULL REQUEST for human
# review.
#
# Hard rails:
#   * workflow_dispatch only -- no schedule, no workflow_run, no push, no PR
#     trigger, no repository_dispatch.
#   * Default dispatch (apply=false) is a NO-NETWORK candidate-report PROOF run:
#     it selects fresh candidates and writes a value-safe report, makes zero
#     provider calls, writes no metadata, and opens no PR. It never passes
#     --batch / --allow-network / --apply-auto-approved.
#   * apply=true is the only path that goes live. It requires --batch
#     --allow-network --apply-auto-approved with an explicit --max-budget-usd,
#     and applies metadata ONLY through the existing dual-verifier AUTO_APPROVE
#     gate (never single-verifier, never a relaxed band).
#   * Freshness is mandatory on every run: both --fresh-days and --published-after
#     are always passed; published_after is validated to be strictly after the
#     residue edge 2026-04-25, so a run can never sweep the old backlog.
#   * Branch + PR only. Never a direct push to main. No auto-merge step exists.
#   * Provider keys are bound via step env: only -- never interpolated into a
#     run: body, never echoed, never measured (no length/hash/prefix/suffix).

on:
  workflow_dispatch:
    inputs:
      fresh_days:
        description: "Relative lookback window in days (positive integer)"
        required: true
        default: "14"
      published_after:
        description: "Absolute hard floor, ISO YYYY-MM-DD (must be after 2026-04-25)"
        required: true
        default: "2026-05-01"
      limit:
        description: "Max fresh candidates to process (positive integer, <= 50)"
        required: true
        default: "50"
      max_budget_usd:
        description: "Per-run cost ceiling in USD (positive decimal)"
        required: true
        default: "5.00"
      apply:
        description: "false = no-network candidate proof run (default); true = generate + apply dual-verifier-approved"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: summary-auto-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert the App credentials are visible
        # GATED ON `inputs.apply`, unlike the identical step in the other publishing workflows.
        # This workflow holds an invariant they do not -- every secret-bearing step is gated to
        # an apply run (`test_secrets_only_in_step_env`) -- and that invariant wins over the
        # fail-fast placement used elsewhere. A non-apply run reads nothing and publishes
        # nothing, so it has no credential to check.
        if: ${{ inputs.apply }}
        # FAIL FAST, AND FAIL WHERE THE CAUSE IS NAMED (#388).
        #
        # The root cause was not simply an expired credential. It was that
        # `${{ secrets.PAT || secrets.GITHUB_TOKEN }}` falls back on EMPTY and never on
        # INVALID: an expired PAT stays truthy, so the fallback never fired and the job died
        # much later inside a third-party action with `fatal: could not read Username`.
        #
        # UNCONDITIONAL ON PURPOSE. Checking only on the branch that publishes would repeat the
        # exact way this hid: `ingest-airtable` reported green for three weeks after the
        # credential died, because on days with no new records it never reached the step that
        # needed it. A publication workflow that cannot publish should say so on the first run,
        # not on the first run that had something to say.
        env:
          APP_ID_PRESENT: ${{ vars.AEOS_REVERT_APP_ID != '' }}
          APP_KEY_PRESENT: ${{ secrets.AEOS_REVERT_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$APP_ID_PRESENT" != "true" ] || [ "$APP_KEY_PRESENT" != "true" ]; then
            echo "::error::AEOS_REVERT_APP_ID (org variable) or AEOS_REVERT_APP_PRIVATE_KEY (org secret) is not visible to this repository, so no PR can be published. The secret's visibility is 'selected repositories'; First-AI-Movers/articles must be added to it."
            exit 1
          fi
          echo "App id and private key are both visible to this repository."

      - name: Mint a short-lived App token for branch and PR publication
        # SHORT-LIVED, REPOSITORY-SCOPED, NOT A PAT (#388). This installation token expires in
        # about an hour and is scoped to this repository by default -- `owner` and
        # `repositories` are deliberately omitted. It replaces ARTICLE_INGESTION_PR_TOKEN, a
        # personal access token stored 2026-05-03 that went invalid around 2026-08-02 and broke
        # every publishing workflow in this repository without raising an alert.
        #
        # AN APP TOKEN RATHER THAN GITHUB_TOKEN, for a mechanical reason: GitHub suppresses
        # workflow runs on a PR created with the default GITHUB_TOKEN, to prevent recursion. A
        # PR opened that way would never run `aeos-merge-ready` -- the organization's only
        # required check -- and so could never merge. Working around that is exactly why a PAT
        # was here; an App token has the same property with none of the lifetime.
        #
        # Same App, action and pin the organization already trusts for the post-main automatic
        # revert rail (First-AI-Movers/.github `aeos-main-smoke.yml`).
        id: app_token
        if: ${{ inputs.apply }}
        # PINNED BY MAJOR-VERSION TAG, matching this repository's governed convention
        # (SECURITY.md "Dependencies", .github/zizmor.yml `unpinned-uses: ref-pin`,
        # Dependabot version-updates with a cooldown). The organization's own rail
        # SHA-pins this same action; that is First-AI-Movers/.github's policy, not this
        # repository's, and importing it here would leave one SHA pin among sixty-odd
        # tag pins and silently sit outside the Dependabot flow that maintains them.
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AEOS_REVERT_APP_ID }}
          private-key: ${{ secrets.AEOS_REVERT_APP_PRIVATE_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install pytest

      # Validate dispatch inputs fail-closed BEFORE any selection or provider
      # work. Enforces: fresh_days positive int; published_after ISO and strictly
      # after the residue edge 2026-04-25; limit positive int <= 50;
      # max_budget_usd positive decimal. Inputs are read from env (no expression
      # splicing into the shell body).
      - name: Validate inputs (fail-closed)
        env:
          FRESH_DAYS: ${{ inputs.fresh_days }}
          PUBLISHED_AFTER: ${{ inputs.published_after }}
          LIMIT: ${{ inputs.limit }}
          MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
        run: |
          python3 - <<'PY'
          import os, sys, math, datetime
          RESIDUE_EDGE = datetime.date(2026, 4, 25)
          errs = []
          try:
              if int(os.environ.get("FRESH_DAYS", "")) <= 0:
                  errs.append("fresh_days must be a positive integer")
          except ValueError:
              errs.append("fresh_days must be an integer")
          try:
              d = datetime.date.fromisoformat(os.environ.get("PUBLISHED_AFTER", ""))
              if d <= RESIDUE_EDGE:
                  errs.append("published_after must be after 2026-04-25 (the residue edge)")
          except ValueError:
              errs.append("published_after must be an ISO date YYYY-MM-DD")
          try:
              n = int(os.environ.get("LIMIT", ""))
              if n <= 0 or n > 50:
                  errs.append("limit must be a positive integer <= 50")
          except ValueError:
              errs.append("limit must be an integer")
          try:
              mb = float(os.environ.get("MAX_BUDGET_USD", ""))
              # Reject inf / -inf / nan / overflow (e.g. 1e309 -> inf): a
              # non-finite budget passes float()>0 but bypasses the cost ceiling
              # because the runner treats any max_budget_usd > 0 as live.
              if not math.isfinite(mb) or mb <= 0:
                  errs.append("max_budget_usd must be a positive finite decimal")
          except ValueError:
              errs.append("max_budget_usd must be a decimal")
          if errs:
              for e in errs:
                  print(f"[apply] input error: {e}", file=sys.stderr)
              sys.exit(1)
          print("[apply] inputs valid")
          PY

      # apply=false (default): no-network candidate-report PROOF run. Selects
      # fresh candidates, writes a value-safe report (counts + folder/slug),
      # makes zero provider calls, writes no metadata, opens no PR. No --batch /
      # --allow-network / --apply-auto-approved.
      - name: Candidate proof run (apply=false, no network, no writes)
        if: ${{ ! inputs.apply }}
        env:
          FRESH_DAYS: ${{ inputs.fresh_days }}
          PUBLISHED_AFTER: ${{ inputs.published_after }}
          LIMIT: ${{ inputs.limit }}
        run: |
          python3 tools/run_summary_batch.py \
            --missing-only \
            --fresh-days "${FRESH_DAYS}" \
            --published-after "${PUBLISHED_AFTER}" \
            --limit "${LIMIT}" \
            --dry-run \
            --report-path "${RUNNER_TEMP}/summary-apply-report.md" \
            --candidate-report "${RUNNER_TEMP}/summary-candidates.md"
          echo "----- candidate report (value-safe: counts + folder/slug only) -----"
          cat "${RUNNER_TEMP}/summary-candidates.md"

      # apply=true: fail-closed provider-key presence gate (present/absent only,
      # no network). Required = generator + dual verifier; DeepSeek optional (D7).
      - name: Provider-key presence gate (apply=true, fail-closed)
        if: ${{ inputs.apply }}
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 tools/check_provider_keys_present.py \
            --required MINIMAX_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY \
            --optional DEEPSEEK_API_KEY

      # apply=true: LIVE generate + verify + apply. Applies metadata ONLY through
      # the dual-verifier AUTO_APPROVE gate. Bounded by --max-budget-usd and
      # --limit. Freshness mandatory. Keys bound via env: only. This path is
      # operator-triggered; it is never auto-dispatched.
      - name: Generate + apply (apply=true, dual-verifier AUTO_APPROVE only)
        if: ${{ inputs.apply }}
        env:
          FRESH_DAYS: ${{ inputs.fresh_days }}
          PUBLISHED_AFTER: ${{ inputs.published_after }}
          LIMIT: ${{ inputs.limit }}
          MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # DeepSeek is an OPTIONAL fallback (D7). The runner requires
          # DEEPSEEK_API_KEY only when --enable-fallback-on-undersize is set, so
          # enable the long-undersize fallback ONLY when the key is actually
          # present. The check is presence-only ([ -n ]); the value is never
          # printed. With only the three required keys, the live run proceeds
          # without the fallback rather than failing closed on an optional key.
          fallback_flag=""
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            fallback_flag="--enable-fallback-on-undersize"
          else
            echo "[apply] DEEPSEEK_API_KEY absent; long-undersize fallback disabled (DeepSeek is optional)."
          fi
          python3 tools/run_summary_batch.py \
            --batch \
            --allow-network \
            --missing-only \
            --fresh-days "${FRESH_DAYS}" \
            --published-after "${PUBLISHED_AFTER}" \
            --limit "${LIMIT}" \
            --max-budget-usd "${MAX_BUDGET_USD}" \
            --apply-auto-approved \
            ${fallback_flag} \
            --enable-verifier-repair-loop \
            --max-repair-cycles 1 \
            --report-path "${RUNNER_TEMP}/summary-apply-report.md" \
            --candidate-report "${RUNNER_TEMP}/summary-candidates.md"

      # Applied-count gate: count changed article metadata.json files. Zero
      # changes => clean no-op, no rebuild, no PR. Live path only.
      - name: Compute applied count
        if: ${{ inputs.apply }}
        id: applied
        run: |
          count=$(git diff --name-only --diff-filter=d -- 'articles/*/metadata.json' | wc -l | tr -d ' ')
          count=${count:-0}
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "[apply] changed metadata.json files: ${count}"

      # In-job deterministic rebuild chain (only when something was applied) so the
      # generated-artifacts drift check stays green on the PR.
      - name: Rebuild deterministic artifacts
        if: ${{ inputs.apply && steps.applied.outputs.count != '0' }}
        run: |
          python3 tools/rebuild_local.py
          python3 tools/update_docs.py
          python3 tools/export_mcp_data.py
          python3 tools/check_generated_artifacts.py

      # Compose the value-safe PR body to a file (counts + identifiers only), then
      # scan it BEFORE opening the PR. No secrets, no provider logs, no body text.
      - name: Compose and scan PR body (count-only public-surface scan)
        if: ${{ inputs.apply && steps.applied.outputs.count != '0' }}
        env:
          FRESH_DAYS: ${{ inputs.fresh_days }}
          PUBLISHED_AFTER: ${{ inputs.published_after }}
          LIMIT: ${{ inputs.limit }}
          MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
          APPLIED_COUNT: ${{ steps.applied.outputs.count }}
        run: |
          body="${RUNNER_TEMP}/summary-apply-pr-body.md"
          python3 - <<'PY' > "${body}"
          import os, datetime
          fd = int(os.environ["FRESH_DAYS"])
          pa = os.environ["PUBLISHED_AFTER"]
          today = datetime.datetime.now(datetime.timezone.utc).date()
          rel = today - datetime.timedelta(days=fd)
          cutoff = max(rel, datetime.date.fromisoformat(pa))
          print("## Automated fresh-article summaries\n")
          print("Auto-generated by the manual summary auto-apply workflow. Applies "
                "only dual-verifier AUTO_APPROVE summaries. Do not merge until CI is "
                "green and the diff is reviewed.\n")
          print(f"- applied summaries (changed metadata.json): {os.environ['APPLIED_COUNT']}")
          print(f"- effective freshness cutoff: {cutoff.isoformat()}")
          print(f"- fresh_days: {fd}")
          print(f"- published_after: {pa}")
          print(f"- limit: {os.environ['LIMIT']}")
          print(f"- max_budget_usd: {os.environ['MAX_BUDGET_USD']}")
          print("\n### Validation")
          print("- `python3 tools/check_generated_artifacts.py`")
          print("- `python3 -m pytest tools/tests -q`")
          print("\n### Safety")
          print("- branch + PR only; no direct push to main; no auto-merge")
          print("- dual-verifier AUTO_APPROVE is the only metadata-write gate")
          print("\n> If the required CI checks (test / e2e / generated-artifacts) are "
                "absent on this PR, it was opened with the default token; close and "
                "reopen the PR to trigger them before merging.")
          PY
          count=$(grep -cEI 'Authorization:[[:space:]]|Bearer[[:space:]]+[A-Za-z0-9._-]{20,}|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9-]{20,}|BEGIN[[:space:]][A-Z ]*PRIVATE KEY' "${body}" || true)
          if [ "${count:-0}" -gt 0 ]; then
            echo "::error::public-surface scan: ${count} line(s) matched a sensitive pattern (content withheld)"
            exit 1
          fi
          echo "public-surface scan: PR body clean"

      # Open the summaries PR on a stable branch (a re-run updates the same PR,
      # never opens a duplicate). Scoped add-paths: article metadata.json + the
      # deterministic artifacts ONLY -- never bare articles/* (article bodies stay
      # out). There is deliberately NO auto-merge step.
      - name: Open summaries PR
        if: ${{ inputs.apply && steps.applied.outputs.count != '0' }}
        uses: peter-evans/create-pull-request@v8
        with:
          # The App token minted above, not GITHUB_TOKEN: GitHub suppresses workflow runs on a
          # PR created with the default token, so the required `aeos-merge-ready` check would
          # never run and the PR could never merge. No fallback -- see the mint step (#388).
          token: ${{ steps.app_token.outputs.token }}
          branch: summaries/auto-apply
          title: "summaries(auto): apply dual-verifier-approved fresh summaries"
          body-path: ${{ runner.temp }}/summary-apply-pr-body.md
          commit-message: "summaries(auto): apply dual-verifier-approved fresh summaries"
          add-paths: |
            articles/*/metadata.json
            index.json
            sitemap.xml
            feed.xml
            feed.json
            llms.txt
            llms-index.txt
            llms-full.txt
            llms-recent.txt
            README.md
            ROADMAP.md
            mcp-server/src/generated/archive-data.json
