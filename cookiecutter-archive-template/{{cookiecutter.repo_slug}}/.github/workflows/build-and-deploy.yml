name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  # Minimal at workflow level; pages:write + id-token:write scoped to the deploy job
  # only (zizmor excessive-permissions hardening). build inherits read-only.
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install markdown jinja2
      - name: Build site
        run: python3 tools/rebuild_local.py
      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # actions/deploy-pages
      id-token: write   # actions/deploy-pages OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
